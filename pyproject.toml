[project]
name = "xhs-readonly-monitor-lite"
version = "0.1.0"
description = "Read-only CDP helpers for inspecting Xiaohongshu feed cards and note detail metrics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FireJW" }]
dependencies = [
  "requests>=2.31",
  "websockets>=12",
]

[project.scripts]
xhs-readonly-monitor = "xhs_readonly_monitor.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
